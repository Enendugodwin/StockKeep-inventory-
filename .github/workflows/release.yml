name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build exe and installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: powershell -ExecutionPolicy Bypass -File .\build-setup.ps1

      - name: Publish installer to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          if (-not $versionMatch) { throw "Could not read version from pyproject.toml" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $setup = "dist\StockKeepSetup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "StockKeep $tag" --generate-notes --latest
          }
