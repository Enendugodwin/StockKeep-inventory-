name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Show build tool paths
        shell: pwsh
        run: |
          python --version
          Get-ChildItem "C:\Program Files (x86)" -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -like "*Inno*" | Select-Object FullName
          Get-ChildItem "C:\Program Files" -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -like "*Inno*" | Select-Object FullName

      - name: Build exe and installer
        shell: pwsh
        run: |
          $output = & powershell -ExecutionPolicy Bypass -File .\build-setup.ps1 2>&1
          $code = $LASTEXITCODE
          $output | Out-File -FilePath build.log -Encoding utf8
          $output
          if ($code -ne 0) {
            "## Build failed with exit code $code" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $output | Select-Object -Last 100 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit $code
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish installer to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $versionMatch = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"'
          if (-not $versionMatch) { throw "Could not read version from pyproject.toml" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $setup = "dist\StockKeepSetup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "StockKeep $tag" --generate-notes --latest
          }
